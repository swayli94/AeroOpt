# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  # The documentation builds clean locally (`cd docs && make strict`), so keep
  # it that way: a new warning fails the build instead of degrading silently.
  fail_on_warning: true

python:
  install:
    # autodoc imports the package to read its docstrings, and conf.py reads
    # `aeroopt.__version__`, so aeroopt and its runtime dependencies must be
    # installed. `smt` is deliberately absent: it is an optional dependency and
    # conf.py mocks it (`autodoc_mock_imports`).
    - method: pip
      path: .
      extra_requirements:
        - docs

# Only HTML is built. To also offer downloads, add:
#   formats:
#     - pdf     # needs LaTeX; check the maths in docs/source/principles/ renders
#     - epub
